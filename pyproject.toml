[project]
name = "duckbricks"
version = "0.2.0"
description = "Runs SQL against a Databricks SQL warehouse via the Statement Execution API, streams the Arrow-IPC result chunks with backpressure into DuckDB for JSON/rows/Arrow serialization -- no pyarrow required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.2.0",
    "nanoarrow>=0.8.0",
]
# Alternative to the `duckdb` extra's nanoarrow -- same Arrow IPC read/write role
# (see src/duckbricks/_arrow_backend.py), just backed by arro3's Rust-compiled
# wheels instead of nanoarrow's C build. Pick this one if nanoarrow doesn't have
# a working wheel for your platform (nanoarrow's own PyPI coverage has been
# inconsistent on Windows); otherwise prefer `duckdb` -- arro3 is ~12x larger on
# disk for no real speed advantage (see the package's own benchmark notes).
duckdb-arro3 = [
    "duckdb>=1.2.0",
    "arro3-core>=0.8",
    "arro3-io>=0.8",
]

[project.urls]
Repository = "https://github.com/bmsuisse/duckbricks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckbricks"]

[dependency-groups]
dev = [
    "duckbricks[duckdb]",
    "duckbricks[duckdb-arro3]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
