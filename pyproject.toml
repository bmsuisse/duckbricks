[project]
name = "duckbricks"
version = "0.1.3"
description = "Runs SQL against a Databricks SQL warehouse via the Statement Execution API, streams the Arrow-IPC result chunks with backpressure into DuckDB for JSON/rows/Arrow serialization -- no pyarrow required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.2.0",
    "nanoarrow>=0.8.0",
]

[project.urls]
Repository = "https://github.com/bmsuisse/duckbricks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckbricks"]

[dependency-groups]
dev = [
    "duckbricks[duckdb]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
